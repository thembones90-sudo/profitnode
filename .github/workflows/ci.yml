name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node manifestintegritytest.js
      - run: node smoketest.js
      - run: node rendertest.js
      - run: node hardwaretest.js
      - run: node costintegritytest.js
      - run: node mailparsertest.js
      - run: node mailworkflowtest.js
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: node browsertest.js
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
