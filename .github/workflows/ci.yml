name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node manifestintegritytest.js
      - run: node budgetcommandtest.js
      - run: node cloudsingleauthoritytest.js
      - run: node cloudsyncregressiontest.js
      - run: node rigassemblycompacttest.js
      - run: node bloodworkssoldtest.js
      - run: node smoketest.js
      - run: node rendertest.js
      - run: node hardwaretest.js
      - run: node mailparsertest.js
      - run: node mailworkflowtest.js
      - run: node costintegritytest.js
      - run: node auditcorrectnesstest.js
      - run: node manifestintegritytest.js
      - run: node browsertest.js
      - run: node rigassemblycompactbrowsertest.js
