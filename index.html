<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFITNODE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   PROFITNODE — workshop ledger / trading terminal for SHADEZY REPAIR SHOP
   Hardware workshop ledger / trading terminal aesthetic.
   Deliberately single-theme (dark graphite + amber): the terminal
   look is the point, so tokens are fixed rather than swapped
   for a light mode. Background and every color are still painted
   explicitly on :root so the page holds on any host ground.
   ============================================================ */
:root{
  --bg:#15111c;
  --bg-alt:#100c17;
  --panel:#1e1826;
  --panel-2:#261e32;
  --panel-hover:#2e2440;
  --border:#372a49;
  --border-strong:#4a3760;
  --text:#ffffff;
  --text-dim:#eee8f5;
  --text-mute:#c6bbd3;
  --amber:#a855f7;
  --amber-dim:#7e22ce;
  --amber-wash:rgba(168,85,247,.14);
  --green:#3ecf7e;
  --green-dim:#1f7a48;
  --green-wash:rgba(62,207,126,.12);
  --red:#dc2626;
  --red-dim:#7f1d1d;
  --red-wash:rgba(220,38,38,.15);
  --blue:#5b9dd9;
  --blue-wash:rgba(91,157,217,.12);
  --performance:#45d7ff;
  --performance-wash:rgba(69,215,255,.12);
  --radius:3px;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --stamp:'Oswald',var(--sans);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:12.5px;
  line-height:1.42;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--amber);color:#f8f0ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute)}

/* ---------- layout ---------- */
#root{display:flex;min-height:100vh;width:100%}
.sidebar{
  width:216px;flex:0 0 216px;background:var(--bg-alt);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:20px 18px 16px;border-bottom:1px solid var(--border);
}
.brand-mark{
  font-family:var(--stamp);font-weight:700;font-size:20px;letter-spacing:.01em;
  color:var(--amber);line-height:1;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.brand-mark::before{
  content:'';width:7px;height:7px;flex:0 0 7px;background:var(--amber);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.brand-rule{height:2px;width:34px;background:var(--amber-dim);margin:9px 0 10px}
.brand-shop{
  font-family:var(--stamp);font-weight:600;font-size:11px;letter-spacing:.09em;
  color:var(--text-dim);text-transform:uppercase;line-height:1.3;
}
.brand-tag{
  font-family:var(--mono);font-size:9.5px;color:var(--text-mute);margin-top:10px;
  padding:4px 7px;border:1px solid var(--border);border-radius:2px;display:inline-block;
  letter-spacing:.04em;
}
nav.mainnav{flex:1;padding:10px 0;overflow-y:auto}
.navlink{
  display:flex;align-items:center;gap:10px;
  padding:10px 18px;font-family:var(--stamp);font-weight:600;font-size:12.5px;
  letter-spacing:.08em;color:var(--text-dim);cursor:pointer;
  border-left:2px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;
  width:100%;text-align:left;
}
.navlink:hover{background:var(--panel);color:var(--text)}
.navlink.active{color:var(--red);border-left-color:var(--red);background:var(--red-wash)}
.navlink .nix{font-family:var(--mono);font-size:10px;color:var(--text-mute);width:16px}
.navlink.active .nix{color:var(--red-dim)}
.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--text-mute);letter-spacing:.03em;
}
.curr-toggle{display:flex;gap:4px;margin-top:8px}
.curr-btn{
  flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--mono);font-size:10.5px;padding:5px 0;cursor:pointer;letter-spacing:.06em;
}
.curr-btn.active{background:var(--red-wash);border-color:var(--red-dim);color:var(--red)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{
  padding:14px 22px;border-bottom:1px solid var(--red-dim);
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg-alt) 100%);
  box-shadow:0 1px 0 var(--red-wash);
}
.topbar h1{
  font-family:var(--stamp);font-size:22px;font-weight:700;letter-spacing:.03em;
  margin:0;text-transform:uppercase;text-wrap:balance;
}
.topbar .sub{font-family:var(--mono);font-size:11px;color:var(--text-mute);margin-top:4px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px 40px;width:100%;max-width:1480px;margin:0 auto}

/* ---------- buttons / inputs ---------- */
.btn{
  font-family:var(--stamp);font-weight:600;font-size:11.5px;letter-spacing:.06em;
  padding:9px 16px;border-radius:var(--radius);border:1px solid var(--border-strong);
  background:var(--panel-2);color:var(--text);cursor:pointer;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{background:var(--panel-hover);border-color:var(--text-mute)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#f8f0ff}
.btn-primary:hover{background:#ffb945;border-color:#ffb945}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--panel-2);border-color:var(--border)}
.btn-danger{border-color:var(--red-dim);color:var(--red)}
.btn-danger:hover{background:var(--red-wash);border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:10.5px}
input,select,textarea{
  font-family:var(--mono);font-size:12.5px;background:var(--bg-alt);
  border:1px solid var(--border-strong);color:var(--text);border-radius:var(--radius);
  padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:1px solid var(--amber);outline-offset:0;border-color:var(--amber-dim);box-shadow:0 0 0 2px rgba(168,85,247,.10)}
textarea{font-family:var(--sans);resize:vertical;min-height:48px}
label.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
label.field span{font-family:var(--stamp);font-size:10.5px;letter-spacing:.09em;color:var(--text-dim);text-transform:uppercase}
label.field span.req::after{content:' *';color:var(--amber)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-bar input[type=text]{max-width:280px}
.search-bar select{max-width:180px;width:auto}

/* ---------- cards / panels ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.panel-head{
  padding:9px 13px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.panel-head h2{
  font-family:var(--stamp);font-size:12.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-dim);margin:0;
}
.panel-body{padding:12px 14px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--panel);padding:12px 14px 11px;min-width:0}
.kpi-label{font-family:var(--stamp);font-size:10px;letter-spacing:.1em;color:var(--text-mute);text-transform:uppercase}
.kpi-value{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value.pos{color:var(--green)}
.kpi-value.neg{color:var(--red)}
.kpi-value.amber{color:var(--amber)}
.kpi-sub{font-family:var(--mono);font-size:10.5px;color:var(--text-mute);margin-top:4px}
.kpi-spark{margin-top:8px;height:20px;display:block}
@media (max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.kpi-grid{grid-template-columns:1fr}}

.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:980px){.two-col{grid-template-columns:1fr}}

/* ---------- tables ---------- */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
thead th{
  text-align:left;font-family:var(--stamp);font-size:10px;letter-spacing:.08em;
  color:var(--text-mute);text-transform:uppercase;font-weight:600;
  padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);border-left:2px solid transparent;vertical-align:middle}
tbody tr:hover td{background:var(--panel-2);border-left-color:var(--red-dim)}
tbody tr:hover td:first-child{padding-left:10px}
td.num,th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono)}
tbody tr.clickable{cursor:pointer}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.empty-row td{text-align:center;color:var(--text-mute);padding:28px;font-family:var(--mono)}

/* ---------- chips / stamps ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--stamp);font-weight:600;
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;
  border-radius:2px;border:1px solid var(--border-strong);color:var(--text-dim);
  white-space:nowrap;
}
.chip-amber{background:var(--amber-wash);border-color:var(--amber-dim);color:var(--amber)}
.chip-amber-outline{background:transparent;border-color:var(--amber-dim);color:var(--amber-dim)}
.chip-green{background:var(--green-wash);border-color:var(--green-dim);color:var(--green)}
.chip-green-outline{background:transparent;border-color:var(--green-dim);color:var(--green)}
.chip-red{background:var(--red-wash);border-color:var(--red-dim);color:var(--red)}
.chip-red-outline{background:transparent;border-color:var(--red-dim);color:var(--red)}
.chip-blue{background:var(--blue-wash);border-color:var(--blue);color:var(--blue)}
.chip-blue-outline{background:transparent;border-color:var(--blue);color:var(--blue)}
.chip-muted{background:var(--panel-2);border-color:var(--border-strong);color:var(--text-mute)}
.score-badge{
  font-family:var(--mono);font-weight:600;font-size:12px;color:var(--bg);
  width:26px;height:26px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;
}

/* ---------- activity / timeline ---------- */
.activity-list{display:flex;flex-direction:column}
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 7px}
.activity-body{min-width:0;flex:1}
.activity-title{font-size:12.5px;color:var(--text)}
.activity-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-mute);margin-top:2px}

.tl-day{margin-bottom:22px}
.tl-day-head{
  font-family:var(--stamp);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--amber);
  padding-bottom:6px;margin-bottom:10px;border-bottom:1px solid var(--border-strong);
  display:flex;align-items:baseline;gap:10px;
}
.tl-day-head .yr{color:var(--text-mute);font-size:10px;font-weight:500}
.tl-entry{
  background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--border-strong);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
}
.tl-entry.t-sold{border-left-color:var(--green)}
.tl-entry.t-purchase{border-left-color:var(--amber)}
.tl-entry.t-listed{border-left-color:var(--blue)}
.tl-entry.t-project{border-left-color:var(--text-mute)}
.tl-entry.t-repair{border-left-color:var(--red)}
.tl-entry.t-rig{border-left-color:var(--amber)}
.tl-title{font-family:var(--stamp);font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.tl-desc{color:var(--text-dim);font-size:12px;margin-top:4px}
.tl-figs{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.tl-fig{font-family:var(--mono);font-size:11.5px;color:var(--text-mute)}
.tl-fig b{color:var(--text);font-weight:600}
.tl-fig.pos b{color:var(--green)}
.tl-fig.neg b{color:var(--red)}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,12,14,.72);display:flex;align-items:flex-start;
  justify-content:center;padding:5vh 20px;z-index:50;overflow-y:auto;
}
.modal{
  background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius);
  width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal-head{
  padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;
}
.modal-head h3{font-family:var(--stamp);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--amber)}
.modal-close{background:none;border:none;color:var(--text-mute);font-size:18px;cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--text-mute);margin:-8px 0 14px}
.checklist{max-height:230px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:4px}
.check-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:2px}
.check-row:hover{background:var(--panel-2)}
.check-row.disabled{opacity:.4}
.check-row input{width:auto}
.check-row .cr-name{flex:1;font-size:12px}
.check-row .cr-price{font-family:var(--mono);font-size:11px;color:var(--text-mute)}

/* ---------- chart ---------- */
.chart-wrap{position:relative}
.chart-tip{
  position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:2px;padding:8px 10px;font-family:var(--mono);font-size:11px;white-space:nowrap;
  transform:translate(-50%,-115%);box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:5;
}
.chart-tip .tip-date{color:var(--text-mute);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.chart-tip .tip-val{font-size:14px;font-weight:600;margin-top:2px}

.info-note{
  font-family:var(--mono);font-size:11px;color:var(--text-mute);line-height:1.7;
  border-top:1px dashed var(--border-strong);margin-top:28px;padding-top:14px;
}
.info-note b{color:var(--text-dim)}

/* ---------- diverging bar chart (profit analytics) ---------- */
.hbar-list{display:flex;flex-direction:column;gap:11px}
.hbar-row{display:grid;grid-template-columns:112px 1fr 92px;align-items:center;gap:10px}
.hbar-label{font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{position:relative;height:16px;background:var(--bg-alt);border-radius:2px;overflow:hidden}
.hbar-zero{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--border-strong)}
.hbar-fill{position:absolute;top:1px;bottom:1px;border-radius:2px}
.hbar-value{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.rank-list{display:flex;flex-direction:column}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-num{font-family:var(--mono);font-size:11px;color:var(--text-mute);width:18px;flex:0 0 18px}
.rank-body{flex:1;min-width:0}
.rank-name{font-size:12.5px;color:var(--text)}
.rank-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-mute);margin-top:2px}
.rank-val{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

.two-step-delete{display:inline-flex}
.badge-count{font-family:var(--mono);font-size:11px;color:var(--text-mute)}

/* ---------- rig build (hardware sandbox) ---------- */
.rig-slot-columns,.rig-slot-row{display:grid;grid-template-columns:116px minmax(420px,760px) 110px 110px auto;justify-content:start;align-items:start;gap:12px}
.rig-slot-columns{padding:0 0 7px;border-bottom:1px solid var(--border-strong);font-family:var(--stamp);font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--text-mute);text-transform:uppercase}
.rig-slot-row{padding:9px 0;border-bottom:1px solid var(--border)}
.rig-slot-row:last-child{border-bottom:none}
.rig-slot-label{font-family:var(--stamp);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--text);text-transform:uppercase;padding-top:6px}
.rig-slot-control{min-width:0;display:grid;grid-template-columns:200px minmax(0,1fr);align-items:start;gap:10px}
.rig-slot-control .field-row{margin:0}
.rig-slot-control>select{width:200px;max-width:100%}
.rig-slot-detail{min-width:0}
.rig-slot-control .rig-catalog-fields{position:relative;max-width:520px}
.rig-catalog-results{position:absolute;z-index:40;top:calc(100% + 3px);left:0;right:0;max-height:240px;overflow-y:auto;border:1px solid var(--border-strong);border-radius:var(--radius);background:#120d19;box-shadow:0 12px 28px rgba(0,0,0,.55)}
.rig-catalog-option{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);text-align:left;cursor:pointer;font-family:var(--mono)}
.rig-catalog-option:last-child{border-bottom:0}
.rig-catalog-option:hover,.rig-catalog-option:focus{outline:0;background:var(--amber-wash);color:#fff}
.rig-catalog-option[class*="pn-tier-"]{border-left:3px solid var(--tier-color)}
.rig-option-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-result-badges{display:flex;align-items:center;gap:7px;flex:none;font-size:9px;text-transform:uppercase}
.pn-result-rating,.pn-result-tier{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid;border-radius:2px;white-space:nowrap}
.pn-result-rating{color:var(--performance);border-color:rgba(69,215,255,.45);background:var(--performance-wash)}
.pn-result-rating b{font-size:10.5px;color:#b9f2ff}
.pn-result-tier{color:var(--tier-color);border-color:var(--tier-border);background:var(--tier-wash);font-weight:600}
.rig-catalog-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:7px 2px 0;color:var(--text-dim);font-family:var(--mono);font-size:10px;line-height:1.35}
.pn-meta-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border:1px solid var(--border-strong);border-radius:2px;background:var(--bg-alt);white-space:nowrap}
.pn-meta-pill span{color:var(--text-mute);text-transform:uppercase;font-size:8.5px;letter-spacing:.06em}
.pn-meta-pill b{color:var(--text);font-size:10.5px}
.pn-performance-pill{border-color:rgba(69,215,255,.45);background:var(--performance-wash)}
.pn-performance-pill span,.pn-performance-pill b,.pn-performance-text{color:var(--performance)}
.pn-tier-pill{border-color:var(--tier-border);background:var(--tier-wash)}
.pn-tier-pill span,.pn-tier-pill b,.pn-tier-text{color:var(--tier-color)}
.pn-tier-text{font-weight:700;text-shadow:0 0 14px var(--tier-wash)}
.pn-tier-scrapblade{--tier-color:#d95555;--tier-border:rgba(217,85,85,.48);--tier-wash:rgba(217,85,85,.13)}
.pn-tier-scrapwraith{--tier-color:#e58a3a;--tier-border:rgba(229,138,58,.48);--tier-wash:rgba(229,138,58,.13)}
.pn-tier-revenant{--tier-color:#a970ff;--tier-border:rgba(169,112,255,.5);--tier-wash:rgba(169,112,255,.14)}
.pn-tier-ghoul{--tier-color:#55d68b;--tier-border:rgba(85,214,139,.48);--tier-wash:rgba(85,214,139,.13)}
.pn-tier-alghoul{--tier-color:#ffd166;--tier-border:rgba(255,209,102,.52);--tier-wash:rgba(255,209,102,.14)}
.pn-meta-detail{color:var(--text-dim);white-space:nowrap;padding-left:2px}
.rig-catalog-help{color:var(--text-mute);padding-top:2px}
.ram-config-grid{display:grid;grid-template-columns:repeat(5,minmax(72px,1fr));gap:6px;margin-top:6px;max-width:680px}
.ram-config-grid label{min-width:0}
.ram-config-grid label>span{display:block;margin:0 0 3px;font-family:var(--stamp);font-size:8px;letter-spacing:.06em;color:var(--text-mute);text-transform:uppercase}
.ram-config-grid input,.ram-config-grid select{width:100%;min-width:0;padding:6px 7px;font-size:10.5px}
.ram-config-wide{grid-column:span 2}
.rig-slot-price{padding-top:0}
.rig-price-input{width:100%;min-width:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:6px;padding-right:6px;color:var(--text)}
.rig-price-input[readonly]{color:var(--text-dim);background:var(--bg-alt);cursor:not-allowed}
.rig-slot-actions{display:flex;align-items:flex-start;padding-top:5px}
.rig-empty-slot{display:inline-block;width:max-content;min-width:180px;border:1px dashed var(--border-strong);border-radius:var(--radius);padding:5px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--text-mute)}
.warn-list{margin:0;padding-left:18px;font-family:var(--mono);font-size:11.5px;color:var(--red);line-height:1.8}
.warn-list li{margin-bottom:2px}
.rig-editor-content{padding:10px 14px 24px;max-width:1680px}
.rig-editor-content .panel-body{padding:8px 12px}
.rig-editor-content .panel-head{padding:8px 12px}
.rig-editor-content textarea{min-height:34px}
.rig-editor-content .rig-slot-row{padding:5px 0;gap:9px}
.rig-editor-content .rig-slot-columns{padding-bottom:5px;gap:9px}
.rig-editor-content .rig-catalog-meta{margin-top:4px}
.rig-editor-content .kpi{padding:8px 11px}
.rig-editor-content .kpi-grid{margin-bottom:10px}

/* ---------- deal score preview (auto deal engine) ---------- */
.score-preview{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--bg-alt)}
.score-preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.score-preview-chip{font-size:11.5px;padding:5px 11px}
.score-row{display:grid;grid-template-columns:112px 1fr 64px;align-items:center;gap:10px;padding:4px 0}
.score-row-label{font-family:var(--stamp);color:var(--text-mute);text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.score-row-val{font-family:var(--mono);color:var(--text-dim);font-size:11px}
.score-row-bar{background:var(--border);height:5px;border-radius:3px;overflow:hidden}
.score-row-fill{display:block;height:100%;background:var(--amber-dim)}
.kind-tag{font-family:var(--mono);font-size:9px;color:var(--text-mute);letter-spacing:.04em;text-transform:uppercase}

/* ---------- build planner ---------- */
.planner-kpi-input{
  font-family:var(--mono);font-size:22px;font-weight:600;background:transparent;
  border:none;border-bottom:1px dashed var(--border-strong);color:var(--amber);
  padding:2px 0;width:100%;
}
.planner-kpi-input:focus{outline:none;border-bottom-color:var(--amber)}
.table-input{background:transparent;border:1px solid transparent;padding:5px 7px;border-radius:2px;width:100%;font-family:var(--mono);font-size:12px;color:var(--text)}
.table-input:hover{background:var(--bg-alt);border-color:var(--border)}
.table-input:focus{background:var(--bg-alt);border-color:var(--amber-dim);outline:none}
.item-add-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.inv-picker{border:1px solid var(--border);border-radius:var(--radius);padding:6px;margin-bottom:14px;max-height:220px;overflow-y:auto;background:var(--bg-alt)}
.inv-picker-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:2px}
.inv-picker-row:hover{background:var(--panel-2)}
.inv-picker-row .ip-name{flex:1;font-size:12px}
.inv-picker-row .ip-price{font-family:var(--mono);font-size:11px;color:var(--text-mute)}
@media (max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .15s;z-index:60}
  .sidebar.open{transform:translateX(0)}
  .main{height:auto;min-height:100vh}
  .content{overflow-y:visible}
  .rig-slot-columns{display:none}
  .rig-slot-row{grid-template-columns:1fr 1fr;gap:7px 10px}
  .rig-slot-label,.rig-slot-control,.rig-slot-actions{grid-column:1/-1;padding-top:0;text-align:left}
  .rig-slot-price:before{content:attr(data-label);display:block;margin-bottom:4px;font-family:var(--stamp);font-size:8.5px;letter-spacing:.06em;color:var(--text-mute)}
  .rig-slot-control{grid-template-columns:1fr}
  .rig-slot-control .rig-catalog-fields{grid-template-columns:1fr}
  .ram-config-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
